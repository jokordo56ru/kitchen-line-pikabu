<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кухонный Переполох — Линия раздачи</title>
<style>
:root{--ink:#160f09;--en:#241a11;--en2:#33261a;--pa:#f9efdb;--pa2:#e7d6b6;--to:#ff4b33;--ol:#9ecb4a;--am:#ffab1f;--co:#e07a3c;--ic:#63c9ff;--pl:#9a4ddb;--go:#ffd76a;--mi:#4fe0a8;--mu:#b8a68f;--acc:#ffab1f;--d:"Arial Black",Impact,system-ui,sans-serif;--m:ui-monospace,Menlo,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--pa);font:700 14px system-ui,-apple-system,Roboto,Arial,sans-serif;user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden}
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track{background:#150e07;border-radius:10px;border:2px solid #0b0704}
*::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--acc),var(--co) 62%,#7d3c12);border-radius:10px;border:2px solid #0b0704;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
*::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#fff2c8,var(--acc) 60%,var(--to))}
*{scrollbar-color:var(--co) #150e07;scrollbar-width:thin}
#shell{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(circle at 12% -8%,rgba(255,171,31,.16),transparent 55%),radial-gradient(circle at 88% 4%,rgba(99,201,255,.11),transparent 52%),linear-gradient(180deg,#241a11,#160f09 62%,#100b06)}
#rail{flex:none;padding:8px 10px 0;background:linear-gradient(180deg,#4a3826,#2b2015);border-bottom:4px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.14);z-index:5}
.rt{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.br{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.br h1{font:900 clamp(13px,3.4vw,19px)/1 var(--d);letter-spacing:1.4px;color:var(--go);text-shadow:0 2px 0 #8a3a10,0 4px 0 rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br i{font:400 8px var(--m);letter-spacing:2.6px;color:var(--mu);font-style:normal;text-transform:uppercase}
.pu{padding:5px 11px;border-radius:11px;border:3px solid var(--ink);background:linear-gradient(180deg,#6d5438,#3a2b1c);font:900 14px var(--d);color:var(--am);white-space:nowrap;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 3px 0 rgba(0,0,0,.45)}
#chip{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(180deg,#6d5438,#3a2b1c);cursor:pointer;flex:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 3px 0 rgba(0,0,0,.45)}
#chip canvas{width:32px;height:38px;display:block}
#chip b{display:block;font:900 11px var(--d);max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chip i{display:block;font:400 8px var(--m);color:var(--go);font-style:normal}
.ib{width:34px;height:34px;flex:none;border-radius:11px;border:3px solid var(--ink);cursor:pointer;background:linear-gradient(180deg,#6d5438,#3a2b1c);color:var(--pa);font-size:14px;display:grid;place-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.45)}
.ib:active{transform:translateY(3px);box-shadow:none}.ib.off{opacity:.42}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 1px 9px;scrollbar-width:none}.tabs::-webkit-scrollbar{height:0}
.tab{position:relative;flex:none;min-width:100px;padding:9px 12px 12px;border:none;cursor:pointer;font-family:var(--d);background:linear-gradient(180deg,var(--pa),var(--pa2));color:#5c4526;border-radius:3px 3px 5px 5px;box-shadow:0 4px 0 rgba(0,0,0,.42);transition:transform .14s;text-align:left}
.tab:before{content:'';position:absolute;left:0;right:0;top:-5px;height:6px;background:radial-gradient(circle at 5px 6px,transparent 4.4px,var(--pa) 5px) repeat-x;background-size:10px 6px}
.tab u{display:block;font:400 7.5px var(--m);letter-spacing:1.8px;color:#9c8460;text-decoration:none}
.tab b{display:block;font-size:11.5px;letter-spacing:.9px}
.tab s{position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px;background:var(--tc);opacity:.35;text-decoration:none}
.tab:hover{transform:translateY(-3px)}
.tab.on{transform:translateY(-5px);color:#2b1c08;box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 22px var(--tc)}
.tab.on s{opacity:1;height:4px}
.tab em{position:absolute;right:5px;top:5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;border:2px solid var(--ink);background:var(--to);color:#2b0700;font:900 9.5px/14px var(--d);font-style:normal;display:none;text-align:center}
.tab em.on{display:block}
#sts{position:relative;flex:1;min-height:0;overflow:hidden}
.st{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:15px 13px calc(22px + env(safe-area-inset-bottom));display:none}
.st.on{display:block;animation:si .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes si{from{opacity:0;transform:translateY(12px)}}
.wr{width:min(1060px,100%);margin:0 auto;min-width:0}
.sh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:13px;padding-bottom:10px;border-bottom:3px solid rgba(0,0,0,.4);position:relative}
.sh:after{content:'';position:absolute;left:0;bottom:-3px;width:110px;height:3px;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.sh .tt{flex:1;min-width:170px}
.sh h2{font:900 clamp(17px,4.4vw,25px)/1 var(--d);letter-spacing:1.8px;color:var(--acc);text-shadow:0 3px 0 rgba(0,0,0,.55)}
.sh p{font-size:10.5px;color:var(--mu);margin-top:5px;line-height:1.45;max-width:58ch}
.kp{display:flex;gap:6px;flex-wrap:wrap}
.kp>div{padding:7px 11px;border-radius:10px;border:2.5px solid var(--ink);background:linear-gradient(180deg,rgba(90,70,46,.6),rgba(28,20,13,.7));text-align:center;min-width:60px}
.kp b{display:block;font:900 18px/1 var(--d)}
.kp span{display:block;font:900 7.5px var(--d);letter-spacing:1.1px;color:var(--mu);margin-top:3px}
.btn{display:block;width:100%;padding:13px;border-radius:13px;border:3px solid var(--ink);cursor:pointer;font:900 15px var(--d);letter-spacing:1.2px;color:#3a1e00;background:linear-gradient(180deg,#ffe0a0,var(--am) 48%,#d1791a);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 6px 0 #8a4418}
.btn:active{transform:translateY(6px);box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
.btn.big{font-size:clamp(15px,2.6vw,19px);padding:clamp(13px,2.2vw,18px);letter-spacing:2px;margin-top:11px}
.btn.alt{background:linear-gradient(180deg,#7c6144,#43331f);color:var(--pa);box-shadow:inset 0 3px 0 rgba(255,255,255,.2),0 6px 0 #1a1208}
.btn.go{background:linear-gradient(180deg,#fff4cc,var(--go));color:#3a2600;box-shadow:inset 0 3px 0 rgba(255,255,255,.65),0 6px 0 #8a6a10}
.btn.gr{background:linear-gradient(180deg,#d8f7a8,var(--ol));color:#1c2a08;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 6px 0 #3d5c14}
.btn.he{background:linear-gradient(180deg,#ffb09a,var(--to));color:#2b0700;box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 6px 0 #5a1206}
.btn:disabled{filter:grayscale(.75) brightness(.58);cursor:default;transform:none}
.pn{border:3px solid var(--ink);border-radius:15px;background:linear-gradient(180deg,rgba(92,70,46,.55),rgba(28,20,13,.72));box-shadow:inset 0 3px 0 rgba(255,255,255,.12),0 5px 0 rgba(0,0,0,.35);padding:12px;min-width:0}
.lb{font:900 8.5px var(--d);letter-spacing:2.2px;color:var(--mu);text-transform:uppercase;margin-bottom:7px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 64px;padding:9px 4px;border-radius:10px;border:2.5px solid var(--ink);cursor:pointer;font:900 11px var(--d);background:linear-gradient(180deg,#5e4830,#33261a);color:var(--mu)}
.seg button.on{background:linear-gradient(180deg,#ffca6a,var(--co));color:#2b1200}
.seg button.on.he{background:linear-gradient(180deg,#ff8a72,#a8210f);color:#fff}
.seg button:disabled{filter:grayscale(.8) brightness(.5);cursor:default}
.hub{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:13px;align-items:start}
.hub>div{min-width:0}
@media(max-width:820px){.hub{grid-template-columns:minmax(0,1fr)}}
.hero{position:relative;border:3px solid var(--ink);border-radius:17px;overflow:hidden;box-shadow:0 7px 0 rgba(0,0,0,.45)}
.hero canvas{display:block;width:100%;height:auto;aspect-ratio:880/412}
.hero .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:13px;background:linear-gradient(180deg,transparent 34%,rgba(12,8,4,.88))}
.hero .ov b{font:900 clamp(15px,2.6vw,20px) var(--d);letter-spacing:1.3px;color:var(--go);text-shadow:0 3px 0 rgba(0,0,0,.7)}
.hero .ov i{font-style:normal;font-size:10.5px;margin-top:4px}
.hero .tg{position:absolute;left:11px;top:11px;padding:5px 10px;border-radius:9px;border:2.5px solid var(--ink);background:linear-gradient(180deg,#ff8a72,#c02a17);color:#fff;font:900 9px var(--d);letter-spacing:1.1px;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .nu{position:absolute;right:11px;top:11px;width:32px;height:32px;border-radius:10px;border:3px solid var(--ink);background:linear-gradient(180deg,#ffe9a8,var(--co));color:#2b1200;font:900 15px/26px var(--d);text-align:center}
.srow{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-top:11px;min-width:0}
.shop{flex:none;width:128px;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,#5e4830,#2b2015);position:relative;transition:transform .13s}
.shop:hover{transform:translateY(-3px)}.shop.on{border-color:var(--go);box-shadow:0 0 0 3px rgba(255,215,106,.3)}
.shop.lk{filter:grayscale(.65) brightness(.6);cursor:default}
.shop canvas{display:block;width:100%;height:auto;aspect-ratio:256/112;border-bottom:2.5px solid var(--ink)}
.shop div{padding:6px 8px 8px}
.shop b{display:block;font:900 9.5px var(--d);line-height:1.2}
.shop i{display:block;font:400 7.5px var(--m);color:var(--mu);font-style:normal;margin-top:3px}
.shop u{position:absolute;right:5px;top:5px;padding:2px 6px;border-radius:7px;border:2px solid var(--ink);font:900 7px var(--d);text-decoration:none;z-index:2}
.mods{display:flex;gap:7px;flex-wrap:wrap}
.mod{flex:1 1 148px;min-width:0;display:flex;gap:8px;align-items:center;padding:9px;border-radius:11px;border:2.5px solid var(--ink);cursor:pointer;background:linear-gradient(180deg,#4a3826,#241a10);text-align:left;color:var(--pa);font-family:system-ui}
.mod svg{width:20px;height:20px;flex:none}
.mod span{flex:1;min-width:0}
.mod b{display:block;font:900 9.5px var(--d)}
.mod i{display:block;font-style:normal;font-size:8px;color:var(--mu);margin-top:2px;line-height:1.3}
.mod u{width:18px;height:18px;flex:none;border-radius:6px;border:2.5px solid var(--ink);background:#161009;display:grid;place-items:center;font-size:10px;color:transparent;text-decoration:none}
.mod.on{border-color:var(--to);background:linear-gradient(180deg,#6d2a1c,#33140c)}.mod.on u{background:var(--to);color:#2b0700}
.ms{margin-top:10px;padding:9px;border-radius:10px;border:2.5px solid var(--ink);background:linear-gradient(180deg,var(--pa),var(--pa2));color:#4a3720;font:700 10.5px var(--m);text-align:center}
.ms em{font-style:normal;color:#2e7a3a}
.gb{margin-top:10px;padding:10px;border-radius:10px;border:2.5px solid var(--ink);background:rgba(12,8,4,.5);font-size:10px;line-height:1.5}
.gb b{color:var(--go);font:900 9px var(--d);letter-spacing:1.3px;display:block;margin-bottom:4px}
.crew{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:13px;align-items:start}
@media(max-width:820px){.crew{grid-template-columns:minmax(0,1fr)}}
.spot{position:relative;border:3px solid var(--ink);border-radius:17px;padding:13px;overflow:hidden;background:linear-gradient(160deg,#6d5436,#3a2b1c 58%,#2a1f14);box-shadow:0 7px 0 rgba(0,0,0,.45)}
.spot canvas{display:block;width:100%;height:auto;aspect-ratio:540/412;position:relative}
.spot .si{position:relative;text-align:center}
.spot .si b{display:block;font:900 clamp(15px,2.4vw,19px) var(--d);color:var(--go)}
.spot .si i{display:block;font-style:normal;font-size:10.5px;margin-top:4px}
.spot .si em{display:block;font:700 9.5px var(--m);color:var(--mi);font-style:normal;margin-top:3px}
.spot .ss{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:9px}
.spot .ss span{font:900 7.5px var(--d);padding:5px 8px;border-radius:8px;border:2px solid var(--ink);background:rgba(12,9,5,.5);color:var(--mu)}
.spot .ss b{display:inline;font-size:11px;color:var(--pa);margin-left:4px}
.spot .lk{position:absolute;inset:0;background:rgba(10,7,4,.92);display:grid;place-items:center;text-align:center;padding:18px;font:900 13px var(--d);color:var(--go);line-height:1.6;z-index:3}
.spot .lk em{display:block;font:700 10.5px system-ui;color:var(--pa);font-style:normal;margin-top:8px}
.rost{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px;min-width:0}
.cf{position:relative;padding:8px 6px;border-radius:13px;border:2.5px solid var(--ink);cursor:pointer;text-align:center;background:linear-gradient(180deg,#5e4830,#2b2015);transition:transform .13s}
.cf:hover{transform:translateY(-4px)}.cf.on{border-color:var(--go);box-shadow:0 0 0 3px rgba(255,215,106,.3)}
.cf.se{background:linear-gradient(180deg,#4c3762,#241a33)}
.cf canvas{display:block;width:100%;height:auto;aspect-ratio:196/168}
.cf b{display:block;font:900 9.5px var(--d);margin-top:2px}
.cf i{display:block;font:900 7.5px var(--d);color:var(--go);font-style:normal;margin-top:3px}
.cf s{display:block;height:5px;margin-top:3px;border-radius:3px;background:#161009;border:1.5px solid #4c3a26;overflow:hidden;text-decoration:none}
.cf s b{display:block;height:100%;background:linear-gradient(90deg,var(--go),var(--co))}
.cf u{position:absolute;inset:0;border-radius:11px;background:rgba(10,7,4,.84);display:grid;place-items:center;font-size:17px;color:var(--go);text-decoration:none}
.demo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,246px);gap:12px;margin-bottom:13px;align-items:start}
@media(max-width:820px){.demo{grid-template-columns:minmax(0,1fr)}}
.ds{position:relative;border:3px solid var(--ink);border-radius:15px;overflow:hidden;background:#100b06;min-width:0}
.ds canvas{display:block;width:100%;height:auto;aspect-ratio:880/448;max-height:320px;object-fit:contain}
.ds .h2{position:absolute;left:9px;top:9px;display:flex;gap:5px;flex-wrap:wrap;max-width:62%}
.ds .h2 span{padding:4px 8px;border-radius:8px;border:2px solid var(--ink);background:rgba(12,8,4,.78);font:700 9.5px var(--m)}
.ds .h2 b{color:var(--go)}
.ds .nm{position:absolute;right:9px;top:9px;padding:5px 10px;border-radius:9px;border:2.5px solid var(--ink);background:linear-gradient(180deg,#6d5438,#3a2b1c);font:900 10.5px var(--d);color:var(--go);max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc{display:flex;flex-direction:column;gap:8px;min-width:0}
.dr{display:flex;align-items:center;gap:8px}
.dr .k{font:900 9px var(--d);letter-spacing:1px;color:var(--mu);width:58px;flex:none}
.dr .v{font:900 14px var(--d);color:var(--go);width:32px;text-align:right;flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:24px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;border:2.5px solid var(--ink);background:linear-gradient(90deg,var(--acc),var(--co))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:7px;border:3px solid var(--ink);background:linear-gradient(180deg,#fff4cc,var(--go))}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;border:2.5px solid var(--ink);background:var(--co)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:6px;border:3px solid var(--ink);background:var(--go)}
.sw{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:2.5px solid var(--ink);background:linear-gradient(180deg,#4a3826,#241a10);cursor:pointer;font:900 10.5px var(--d);color:var(--mu)}
.sw u{width:38px;height:21px;flex:none;border-radius:11px;border:2.5px solid var(--ink);background:#161009;position:relative;text-decoration:none}
.sw u:after{content:'';position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:5px;background:#6b5a44;transition:.18s}
.sw.on{color:var(--go);border-color:var(--go)}.sw.on u{background:linear-gradient(90deg,var(--co),var(--go))}.sw.on u:after{left:19px;background:#fff8dc}
.ev{display:flex;align-items:center;gap:6px;padding:10px;border-radius:11px;border:2.5px solid var(--ink);background:linear-gradient(180deg,rgba(92,70,46,.5),rgba(28,20,13,.7))}
.ev .nd{flex:1;min-width:0;text-align:center}
.ev .nd svg{width:28px;height:28px;display:block;margin:0 auto}
.ev .nd b{display:block;font:900 8.5px var(--d);margin-top:4px;line-height:1.2}
.ev .nd i{display:block;font:400 7.5px var(--m);color:var(--mu);font-style:normal;margin-top:2px}
.ev .ar{font:900 15px var(--d);color:var(--co);flex:none}
.ev .rs{border-radius:9px;padding:5px 3px;border:2px solid #7a5210;background:linear-gradient(180deg,#fff2cc,#f0d79a);box-shadow:0 0 14px rgba(255,215,106,.4)}
.ev .rs b{color:#5a3a10}.ev .rs i{color:#8a6a2a}
.sr{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;border:2.5px solid var(--ink);background:linear-gradient(180deg,#1c1409,#120c06);flex:1 1 170px;min-width:0}
.sr input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--pa);font:700 12px var(--m)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.c2{padding:7px 10px;border-radius:9px;border:2.5px solid var(--ink);cursor:pointer;font:900 10px var(--d);background:linear-gradient(180deg,#4a3826,#241a10);color:var(--mu)}
.c2.on{background:linear-gradient(180deg,var(--acc),var(--co));color:#2b1200}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(174px,1fr));gap:9px;min-width:0}
.wc{position:relative;border:2.5px solid var(--ink);border-radius:13px;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,#5e4830,#2b2015);transition:transform .13s}
.wc:hover{transform:translateY(-4px)}.wc.on{border-color:var(--ic);box-shadow:0 0 0 3px rgba(99,201,255,.3)}
.wc.lk{filter:grayscale(.6) brightness(.62)}
.wc canvas{display:block;width:100%;height:auto;aspect-ratio:348/124;border-bottom:2.5px solid var(--ink)}
.wc .wb{padding:8px 9px 9px}
.wc b{display:block;font:900 10.5px var(--d)}
.wc i{display:block;font-style:normal;font-size:8.5px;color:var(--mu);margin-top:3px;line-height:1.35;min-height:22px}
.wc em{display:block;font:400 7.5px var(--m);color:var(--go);font-style:normal;margin-top:6px;border-top:1.5px dashed rgba(255,215,106,.3);padding-top:5px}
.wc u{position:absolute;left:6px;top:6px;padding:2px 6px;border-radius:6px;border:2px solid var(--ink);background:rgba(12,8,4,.8);font:400 7.5px var(--m);color:var(--ic);text-decoration:none}
.wc s{position:absolute;right:6px;top:6px;font-size:12px;text-decoration:none}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;margin-top:11px;min-width:0}
.tc{display:flex;gap:8px;padding:9px;border-radius:11px;border:2.5px solid var(--ink);background:linear-gradient(180deg,#4c5c3a,#28321c);min-width:0}
